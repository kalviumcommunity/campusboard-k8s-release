apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusboard
spec:
  ingressClassName: campusboard
  rules:
    - host: campusboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campusboard
                port:
                  number: 80
